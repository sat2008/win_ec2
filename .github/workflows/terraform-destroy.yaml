name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm destroy'
        required: true

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-destroy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'yes' }}

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::508261694247:role/GithubTerraformRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # IMPORTANT: Use -reconfigure and do NOT override backend
      - name: Terraform Init (matches backend in code)
        working-directory: terraform
        run: terraform init -reconfigure

      - name: Terraform Plan Destroy
        working-directory: terraform
        run: terraform plan -destroy -var-file="terraform.tfvars" -out=tfplan.destroy

      - name: Terraform Destroy
        working-directory: terraform
        run: terraform apply -auto-approve tfplan.destroy

      - name: Upload Destroy Logs
        uses: actions/upload-artifact@v4
        with:
          name: destroy-logs
          path: terraform/